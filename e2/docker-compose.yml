version: "3.9"

services:
  echo-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcp-echo
    container_name: echo-server
    ports:
      - "8007:8007"
    networks:
      - echo-net

  echo-client-1:
    image: tcp-echo
    container_name: echo-client-1
    depends_on:
      - echo-server
    command: >
      java -cp out org.example.TcpEchoClient echo-server 8007 "Hello from client 1!"
    networks:
      - echo-net

  echo-client-2:
    image: tcp-echo
    container_name: echo-client-2
    depends_on:
      - echo-server
    command: >
      java -cp out org.example.TcpEchoClient echo-server 8007 "Hello from client 2!"
    networks:
      - echo-net

  echo-client-3:
    image: tcp-echo
    container_name: echo-client-3
    depends_on:
      - echo-server
    command: >
      java -cp out org.example.TcpEchoClient echo-server 8007 "Hello from client 3!"
    networks:
      - echo-net

networks:
  echo-net:
    driver: bridge
